<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Scheduler</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }

    a.button {
      display: inline-block;
      padding: 16px 32px;
      background: #238636;
      color: #ffffff;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      transition: background 0.15s ease;
    }

    a.button:hover {
      background: #2ea043;
    }

    a.button:focus-visible {
      outline: 2px solid #58a6ff;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <a class="button" href="https://github.com/Abdul2048/Email_Scheduler">
    Open Email Scheduler
  </a>
</body>
</html>
